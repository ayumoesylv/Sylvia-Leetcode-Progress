name: Sync LeetCode
on:
  workflow_dispatch: # Allows you to run the script manually at any time
  schedule:
    - cron: "0 8 * * *" # Automatically runs every day at 8:00 AM UTC
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run Sync
        uses: joshcai/leetcode-sync@v1.5
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
